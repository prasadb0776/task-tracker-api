<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #6b7686;
    --border: #dde2e8; --accent: #2f6fed; --accent-text: #ffffff;
    --danger: #c93636; --ok: #1f8a4c; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181e; --card: #1c222b; --text: #e6e9ee; --muted: #94a0b0;
      --border: #2c3440; --accent: #6d9bff; --accent-text: #0e1116;
      --danger: #ff7b7b; --ok: #4cc380; --warn: #e6b450;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  a { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; text-align: center;
  }
  .stat .n { font-size: 22px; font-weight: 600; display: block; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat.overdue .n { color: var(--danger); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .row.tight { gap: 8px; align-items: end; }
  .check { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
  .check input { width: auto; }
  .check label { margin: 0; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #error {
    background: color-mix(in srgb, var(--danger) 12%, var(--card));
    border: 1px solid var(--danger); color: var(--danger);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; white-space: pre-line;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .task { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--card); }
  .task.done h3 { text-decoration: line-through; color: var(--muted); }
  .task.overdue { border-left: 4px solid var(--danger); }
  .task h3 { margin: 0 0 4px; font-size: 16px; word-break: break-word; }
  .task p { margin: 4px 0 8px; color: var(--muted); word-break: break-word; white-space: pre-wrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.high { color: var(--danger); border-color: var(--danger); }
  .badge.medium { color: var(--warn); border-color: var(--warn); }
  .badge.low { color: var(--ok); border-color: var(--ok); }
  .badge.overdue { background: var(--danger); border-color: var(--danger); color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .pager { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); width: min(480px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Task Tracker</h1>
    <a href="/docs">API docs</a>
  </header>

  <div id="error" role="alert" hidden></div>

  <section class="stats" aria-label="Statistics">
    <div class="stat"><span class="n" id="stat-total">0</span><span class="l">Total</span></div>
    <div class="stat"><span class="n" id="stat-todo">0</span><span class="l">To do</span></div>
    <div class="stat"><span class="n" id="stat-in_progress">0</span><span class="l">In progress</span></div>
    <div class="stat"><span class="n" id="stat-done">0</span><span class="l">Done</span></div>
    <div class="stat overdue"><span class="n" id="stat-overdue">0</span><span class="l">Overdue</span></div>
  </section>

  <section class="card">
    <h2>Add a task</h2>
    <form id="createForm">
      <div class="row">
        <div style="grid-column: 1 / -1">
          <label for="c-title">Title</label>
          <input id="c-title" required maxlength="100" placeholder="What needs doing?">
        </div>
      </div>
      <div class="row">
        <div style="grid-column: 1 / -1">
          <label for="c-description">Description (optional)</label>
          <textarea id="c-description" maxlength="1000"></textarea>
        </div>
      </div>
      <div class="row tight">
        <div>
          <label for="c-priority">Priority</label>
          <select id="c-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label for="c-due">Due date (optional)</label>
          <input id="c-due" type="date">
        </div>
        <div><button class="primary" type="submit">Add task</button></div>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="row tight">
      <div>
        <label for="f-q">Search</label>
        <input id="f-q" type="search" placeholder="Title or description">
      </div>
      <div>
        <label for="f-status">Status</label>
        <select id="f-status">
          <option value="">All</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div>
        <label for="f-priority">Priority</label>
        <select id="f-priority">
          <option value="">All</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div>
        <label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="created_at">Created</option>
          <option value="due_date">Due date</option>
          <option value="priority">Priority</option>
          <option value="title">Title</option>
        </select>
      </div>
      <div>
        <label for="f-order">Order</label>
        <select id="f-order">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
      </div>
      <div class="check">
        <input id="f-overdue" type="checkbox">
        <label for="f-overdue">Overdue only</label>
      </div>
    </div>
  </section>

  <ul id="list" aria-live="polite"></ul>

  <div class="pager">
    <button id="prev" type="button">Previous</button>
    <span id="pageInfo"></span>
    <button id="next" type="button">Next</button>
  </div>
</main>

<dialog id="editDialog">
  <form id="editForm">
    <h2>Edit task</h2>
    <div class="row">
      <div style="grid-column: 1 / -1">
        <label for="e-title">Title</label>
        <input id="e-title" required maxlength="100">
      </div>
    </div>
    <div class="row">
      <div style="grid-column: 1 / -1">
        <label for="e-description">Description</label>
        <textarea id="e-description" maxlength="1000"></textarea>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="e-status">Status</label>
        <select id="e-status">
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div>
        <label for="e-priority">Priority</label>
        <select id="e-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div>
        <label for="e-due">Due date</label>
        <input id="e-due" type="date">
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" id="editCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
  const PAGE_SIZE = 10;
  const STATUS_LABELS = { todo: "To do", in_progress: "In progress", done: "Done" };
  const state = { page: 0, total: 0, editingId: null };
  const $ = (id) => document.getElementById(id);

  const todayString = () => new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD

  // Build DOM nodes without innerHTML so task text can never be interpreted as HTML.
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children);
    return node;
  }

  function formatError(data, status) {
    if (data && typeof data.detail === "string") return data.detail;
    if (data && Array.isArray(data.detail)) {
      return data.detail
        .map((e) => `${(e.loc || []).slice(1).join(".") || "input"}: ${e.msg}`)
        .join("\n");
    }
    return `Request failed (${status})`;
  }

  async function api(path, options = {}) {
    const headers = options.body ? { "Content-Type": "application/json" } : {};
    const res = await fetch(path, { ...options, headers });
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch { /* non-JSON body */ }
    if (!res.ok) throw new Error(formatError(data, res.status));
    return data;
  }

  function showError(message) {
    const box = $("error");
    box.textContent = message;
    box.hidden = false;
  }
  const clearError = () => { $("error").hidden = true; };

  async function guarded(action) {
    try {
      clearError();
      await action();
    } catch (err) {
      showError(err.message || "Something went wrong");
    }
  }

  async function loadStats() {
    const stats = await api("/tasks/stats");
    for (const key of ["total", "todo", "in_progress", "done", "overdue"]) {
      $("stat-" + key).textContent = stats[key];
    }
  }

  function buildQuery() {
    const params = new URLSearchParams({
      limit: PAGE_SIZE,
      offset: state.page * PAGE_SIZE,
      sort_by: $("f-sort").value,
      order: $("f-order").value,
    });
    const q = $("f-q").value.trim();
    if (q) params.set("q", q);
    if ($("f-status").value) params.set("status", $("f-status").value);
    if ($("f-priority").value) params.set("priority", $("f-priority").value);
    if ($("f-overdue").checked) params.set("overdue", "true");
    return params;
  }

  async function loadTasks() {
    const data = await api("/tasks?" + buildQuery());
    // If the last task on a page was deleted, step back one page.
    if (data.items.length === 0 && state.page > 0) {
      state.page -= 1;
      return loadTasks();
    }
    state.total = data.total;
    renderTasks(data.items);
    renderPager();
  }

  function renderTask(task) {
    const isOverdue = task.due_date && task.status !== "done" && task.due_date < todayString();

    const meta = el("div", { className: "meta" },
      el("span", { className: "badge", textContent: STATUS_LABELS[task.status] || task.status }),
      el("span", { className: "badge " + task.priority, textContent: task.priority + " priority" }),
    );
    if (task.due_date) {
      meta.append(el("span", { className: "badge", textContent: "Due " + task.due_date }));
    }
    if (isOverdue) {
      meta.append(el("span", { className: "badge overdue", textContent: "Overdue" }));
    }

    const isDone = task.status === "done";
    const toggle = el("button", {
      className: "small primary",
      type: "button",
      textContent: isDone ? "Reopen" : "Mark done",
      onclick: () => guarded(async () => {
        await api(`/tasks/${task.id}`, {
          method: "PATCH",
          body: JSON.stringify({ status: isDone ? "todo" : "done" }),
        });
        await refresh();
      }),
    });
    const edit = el("button", {
      className: "small", type: "button", textContent: "Edit",
      onclick: () => openEdit(task),
    });
    const remove = el("button", {
      className: "small danger", type: "button", textContent: "Delete",
      onclick: () => {
        if (!confirm(`Delete "${task.title}"?`)) return;
        guarded(async () => {
          await api(`/tasks/${task.id}`, { method: "DELETE" });
          await refresh();
        });
      },
    });

    const li = el("li", { className: "task" + (isDone ? " done" : "") + (isOverdue ? " overdue" : "") },
      el("h3", { textContent: task.title }),
    );
    if (task.description) li.append(el("p", { textContent: task.description }));
    li.append(meta, el("div", { className: "actions" }, toggle, edit, remove));
    return li;
  }

  function renderTasks(items) {
    const list = $("list");
    list.replaceChildren();
    if (items.length === 0) {
      list.append(el("li", { className: "empty", textContent: "No tasks match. Add one above." }));
      return;
    }
    items.forEach((task) => list.append(renderTask(task)));
  }

  function renderPager() {
    const pages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
    $("pageInfo").textContent = `Page ${state.page + 1} of ${pages} (${state.total} tasks)`;
    $("prev").disabled = state.page === 0;
    $("next").disabled = state.page + 1 >= pages;
  }

  async function refresh() {
    await Promise.all([loadTasks(), loadStats()]);
  }

  // ---- Create ----
  $("c-due").min = todayString(); // the API rejects past due dates on create

  $("createForm").addEventListener("submit", (event) => {
    event.preventDefault();
    guarded(async () => {
      const body = {
        title: $("c-title").value,
        priority: $("c-priority").value,
      };
      const description = $("c-description").value.trim();
      if (description) body.description = description;
      if ($("c-due").value) body.due_date = $("c-due").value;

      await api("/tasks", { method: "POST", body: JSON.stringify(body) });
      $("createForm").reset();
      state.page = 0;
      await refresh();
    });
  });

  // ---- Edit ----
  function openEdit(task) {
    state.editingId = task.id;
    $("e-title").value = task.title;
    $("e-description").value = task.description || "";
    $("e-status").value = task.status;
    $("e-priority").value = task.priority;
    $("e-due").value = task.due_date || "";
    $("editDialog").showModal();
  }

  $("editCancel").addEventListener("click", () => $("editDialog").close());

  $("editForm").addEventListener("submit", (event) => {
    event.preventDefault();
    guarded(async () => {
      const description = $("e-description").value.trim();
      const body = {
        title: $("e-title").value,
        description: description || null,
        status: $("e-status").value,
        priority: $("e-priority").value,
        due_date: $("e-due").value || null,
      };
      await api(`/tasks/${state.editingId}`, { method: "PATCH", body: JSON.stringify(body) });
      $("editDialog").close();
      await refresh();
    });
  });

  // ---- Filters and paging ----
  let searchTimer;
  $("f-q").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.page = 0; guarded(loadTasks); }, 300);
  });
  for (const id of ["f-status", "f-priority", "f-sort", "f-order", "f-overdue"]) {
    $(id).addEventListener("change", () => { state.page = 0; guarded(loadTasks); });
  }
  $("prev").addEventListener("click", () => { state.page -= 1; guarded(loadTasks); });
  $("next").addEventListener("click", () => { state.page += 1; guarded(loadTasks); });

  guarded(refresh);
</script>
</body>
</html>
